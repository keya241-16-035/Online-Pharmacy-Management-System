<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Medicine Details')}"></head>
<body>

<div th:replace="~{layout :: navbar('medicine')}"></div>

<div class="main-content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-custom p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0">Medicine Details</h4>
                    <div>
                        <a th:href="@{/medicine/edit/{id}(id=${medicine.id})}" class="btn btn-outline-primary btn-sm me-2"><i class="bi bi-pencil-square"></i> Edit</a>
                        <a th:href="@{/medicine}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to Inventory</a>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="p-3 bg-light rounded-3">
                            <span class="text-muted small fw-semibold text-uppercase">Medicine Name</span>
                            <h5 class="fw-bold text-dark mt-1" th:text="${medicine.name}">Paracetamol</h5>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="p-3 bg-light rounded-3">
                            <span class="text-muted small fw-semibold text-uppercase">Category</span>
                            <h5 class="fw-bold text-dark mt-1" th:text="${medicine.category != null ? medicine.category.name : 'Uncategorized'}">Painkillers</h5>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 bg-light rounded-3">
                            <span class="text-muted small fw-semibold text-uppercase">Unit Price</span>
                            <h5 class="fw-bold text-success mt-1" th:text="'$' + ${#numbers.formatDecimal(medicine.price, 1, 'COMMA', 2, 'POINT')}">$5.50</h5>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 bg-light rounded-3">
                            <span class="text-muted small fw-semibold text-uppercase">Stock Quantity</span>
                            <h5 class="fw-bold mt-1" th:classappend="${medicine.quantity <= 10 ? 'text-danger' : 'text-primary'}" th:text="${medicine.quantity} + ' Units'">100 Units</h5>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 bg-light rounded-3">
                            <span class="text-muted small fw-semibold text-uppercase">Expiry Date</span>
                            <h5 class="fw-bold text-dark mt-1" th:text="${medicine.expiryDate}">2026-12-31</h5>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="p-3 bg-light rounded-3">
                            <span class="text-muted small fw-semibold text-uppercase">Supplier Information</span>
                            <p class="fw-semibold text-dark mb-1 mt-1" th:text="${medicine.supplier != null ? medicine.supplier.name : 'No supplier assigned'}">PharmaCare Ltd</p>
                            <p class="text-muted small mb-0" th:if="${medicine.supplier != null}" th:text="'Phone: ' + ${medicine.supplier.phone} + ' | Email: ' + ${medicine.supplier.email}">Phone: 01711223344</p>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="p-3 bg-light rounded-3">
                            <span class="text-muted small fw-semibold text-uppercase">Description & Notes</span>
                            <p class="text-dark mb-0 mt-1" th:text="${medicine.description != null and !#strings.isEmpty(medicine.description) ? medicine.description : 'No description provided.'}">Description goes here...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
