<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Category Management')}"></head>
<body>

<div th:replace="~{layout :: navbar('category')}"></div>

<div class="main-content">
    
    <div th:replace="~{layout :: alerts}"></div>

    <div class="card card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="fw-bold mb-1">Medicine Categories</h4>
                <p class="text-muted small mb-0">Organize and manage medicine classification categories</p>
            </div>
            <a th:href="@{/category/new}" class="btn btn-primary fw-semibold">
                <i class="bi bi-plus-lg me-1"></i> Add New Category
            </a>
        </div>

        <!-- Search Bar -->
        <form th:action="@{/category}" method="get" class="mb-4">
            <div class="input-group" style="max-width: 400px;">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search categories...">
                <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Search</button>
            </div>
        </form>

        <!-- Categories Table -->
        <div class="table-responsive">
            <table class="table table-hover table-custom align-middle">
                <thead class="table-light">
                    <tr>
                        <th style="width: 10%;">ID</th>
                        <th style="width: 50%;">Category Name</th>
                        <th style="width: 20%;">Total Medicines</th>
                        <th style="width: 20%;" class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categories}">
                        <td class="fw-bold text-muted" th:text="${cat.id}">1</td>
                        <td class="fw-semibold" th:text="${cat.name}">Category Name</td>
                        <td>
                            <span class="badge bg-secondary-subtle text-secondary badge-status" th:text="${#lists.size(cat.medicines)} + ' medicines'">0 medicines</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/category/edit/{id}(id=${cat.id})}" class="btn btn-outline-primary btn-sm me-1">
                                <i class="bi bi-pencil-square"></i> Edit
                            </a>
                            <a th:href="@{/category/delete/{id}(id=${cat.id})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure you want to delete this category?')">
                                <i class="bi bi-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="4" class="text-center text-muted py-4">No categories found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
