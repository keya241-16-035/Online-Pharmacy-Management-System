<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Medicine Form')}"></head>
<body>

<div th:replace="~{layout :: navbar('medicine')}"></div>

<div class="main-content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-custom p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0" th:text="${medicine.id == null ? 'Add New Medicine' : 'Edit Medicine Details'}">Medicine Form</h4>
                    <a th:href="@{/medicine}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
                </div>

                <form th:action="@{/medicine/save}" th:object="${medicine}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label fw-semibold">Medicine Name <span class="text-danger">*</span></label>
                            <input type="text" id="name" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="e.g. Paracetamol 500mg">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name is required</div>
                        </div>

                        <div class="col-md-6">
                            <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                            <select id="category" th:field="*{category.id}" class="form-select" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
                                <option value="">-- Select Category --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Painkillers</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Category is required</div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="price" class="form-label fw-semibold">Price ($) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" placeholder="0.00">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price must be greater than 0</div>
                        </div>

                        <div class="col-md-6">
                            <label for="quantity" class="form-label fw-semibold">Stock Quantity <span class="text-danger">*</span></label>
                            <input type="number" id="quantity" th:field="*{quantity}" class="form-control" th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid' : ''" placeholder="Available units">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}">Quantity cannot be negative</div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="supplier" class="form-label fw-semibold">Supplier <span class="text-danger">*</span></label>
                            <select id="supplier" th:field="*{supplier.id}" class="form-select" th:classappend="${#fields.hasErrors('supplier')} ? 'is-invalid' : ''">
                                <option value="">-- Select Supplier --</option>
                                <option th:each="sup : ${suppliers}" th:value="${sup.id}" th:text="${sup.name}">PharmaCare Ltd</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('supplier')}" th:errors="*{supplier}">Supplier selection is required</div>
                        </div>

                        <div class="col-md-6">
                            <label for="expiryDate" class="form-label fw-semibold">Expiry Date <span class="text-danger">*</span></label>
                            <input type="date" id="expiryDate" th:field="*{expiryDate}" class="form-control" th:classappend="${#fields.hasErrors('expiryDate')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}">Expiry date must be in the future</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="Additional dosage instructions, composition, or notes"></textarea>
                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a th:href="@{/medicine}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold"><i class="bi bi-save me-1"></i> Save Medicine</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
