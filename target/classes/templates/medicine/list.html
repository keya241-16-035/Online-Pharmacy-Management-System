<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Medicine Inventory')}"></head>
<body>

<div th:replace="~{layout :: navbar('medicine')}"></div>

<div class="main-content">
    
    <div th:replace="~{layout :: alerts}"></div>

    <div class="card card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="fw-bold mb-1">Medicine Inventory</h4>
                <p class="text-muted small mb-0">Track stock levels, pricing, category, and expiration dates</p>
            </div>
            <a th:href="@{/medicine/new}" class="btn btn-primary fw-semibold">
                <i class="bi bi-plus-lg me-1"></i> Add New Medicine
            </a>
        </div>

        <!-- Search Bar -->
        <form th:action="@{/medicine}" method="get" class="mb-4">
            <div class="input-group" style="max-width: 450px;">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search medicine name or category...">
                <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Search</button>
            </div>
        </form>

        <!-- Medicine Table -->
        <div class="table-responsive">
            <table class="table table-hover table-custom align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Medicine Name</th>
                        <th>Category</th>
                        <th>Supplier</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Expiry Date</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="med : ${medicines}">
                        <td class="fw-bold text-muted" th:text="${med.id}">1</td>
                        <td>
                            <a th:href="@{/medicine/view/{id}(id=${med.id})}" class="fw-bold text-primary text-decoration-none" th:text="${med.name}">Paracetamol</a>
                        </td>
                        <td th:text="${med.category != null ? med.category.name : '-'}">Painkillers</td>
                        <td th:text="${med.supplier != null ? med.supplier.name : '-'}">PharmaCare Ltd</td>
                        <td class="fw-bold text-dark" th:text="'$' + ${#numbers.formatDecimal(med.price, 1, 'COMMA', 2, 'POINT')}">$5.50</td>
                        <td>
                            <span class="badge badge-status"
                                  th:classappend="${med.quantity == 0 ? 'bg-danger' : (med.quantity <= 10 ? 'bg-warning text-dark' : 'bg-success')}"
                                  th:text="${med.quantity} + ' in stock'">100 in stock</span>
                        </td>
                        <td th:text="${med.expiryDate}">2026-12-31</td>
                        <td class="text-end">
                            <a th:href="@{/medicine/view/{id}(id=${med.id})}" class="btn btn-outline-info btn-sm me-1">
                                <i class="bi bi-eye"></i> View
                            </a>
                            <a th:href="@{/medicine/edit/{id}(id=${med.id})}" class="btn btn-outline-primary btn-sm me-1">
                                <i class="bi bi-pencil-square"></i> Edit
                            </a>
                            <a th:href="@{/medicine/delete/{id}(id=${med.id})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure you want to delete this medicine record?')">
                                <i class="bi bi-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(medicines)}">
                        <td colspan="8" class="text-center text-muted py-4">No medicine records found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
