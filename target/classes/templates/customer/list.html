<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Customer Management')}"></head>
<body>

<div th:replace="~{layout :: navbar('customer')}"></div>

<div class="main-content">
    
    <div th:replace="~{layout :: alerts}"></div>

    <div class="card card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="fw-bold mb-1">Customers Directory</h4>
                <p class="text-muted small mb-0">Manage registered customers and contact information</p>
            </div>
            <a th:href="@{/customer/new}" class="btn btn-primary fw-semibold">
                <i class="bi bi-plus-lg me-1"></i> Add New Customer
            </a>
        </div>

        <!-- Search Bar -->
        <form th:action="@{/customer}" method="get" class="mb-4">
            <div class="input-group" style="max-width: 400px;">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by name or phone...">
                <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Search</button>
            </div>
        </form>

        <!-- Customer Table -->
        <div class="table-responsive">
            <table class="table table-hover table-custom align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Customer Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Address</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cust : ${customers}">
                        <td class="fw-bold text-muted" th:text="${cust.id}">1</td>
                        <td class="fw-semibold text-dark" th:text="${cust.name}">John Doe</td>
                        <td th:text="${cust.phone}">01700001122</td>
                        <td th:text="${cust.email != null ? cust.email : '-'}">john.doe@example.com</td>
                        <td th:text="${cust.address != null ? cust.address : '-'}">123 Maple Street</td>
                        <td class="text-end">
                            <a th:href="@{/customer/edit/{id}(id=${cust.id})}" class="btn btn-outline-primary btn-sm me-1">
                                <i class="bi bi-pencil-square"></i> Edit
                            </a>
                            <a th:href="@{/customer/delete/{id}(id=${cust.id})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure you want to delete this customer?')">
                                <i class="bi bi-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(customers)}">
                        <td colspan="6" class="text-center text-muted py-4">No customers found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
