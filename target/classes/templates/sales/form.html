<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('New Sale Transaction')}"></head>
<body>

<div th:replace="~{layout :: navbar('sales')}"></div>

<div class="main-content">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="card card-custom p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold mb-1">New Sale Transaction</h4>
                        <p class="text-muted small mb-0">Select customer and medicines to generate invoice and automatically deduct stock</p>
                    </div>
                    <a th:href="@{/sales}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to Sales</a>
                </div>

                <form th:action="@{/sales/save}" method="post" id="saleForm">
                    <!-- Customer Selection -->
                    <div class="card bg-light border-0 p-3 mb-4">
                        <label for="customerId" class="form-label fw-semibold text-dark">Customer (Optional)</label>
                        <select id="customerId" name="customerId" class="form-select">
                            <option value="">-- Walk-in Customer / Select Registered Customer --</option>
                            <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name + ' (' + c.phone + ')'}">John Doe (01700001122)</option>
                        </select>
                    </div>

                    <!-- Items Header -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold text-dark mb-0">Sale Line Items</h5>
                        <button type="button" class="btn btn-outline-primary btn-sm" id="addItemBtn">
                            <i class="bi bi-plus-circle me-1"></i> Add Another Medicine
                        </button>
                    </div>

                    <!-- Items Container -->
                    <div id="itemsContainer">
                        <div class="row g-3 align-items-center mb-3 item-row p-3 border rounded-3 bg-white">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Select Medicine</label>
                                <select name="medicineId" class="form-select medicine-select" required>
                                    <option value="">-- Choose Medicine --</option>
                                    <option th:each="m : ${medicines}" 
                                            th:value="${m.id}" 
                                            th:data-price="${m.price}"
                                            th:data-stock="${m.quantity}"
                                            th:text="${m.name + ' - $' + m.price + ' (' + m.quantity + ' in stock)'}">
                                        Medicine
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold text-muted">Quantity</label>
                                <input type="number" name="quantity" class="form-control quantity-input" min="1" value="1" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label small fw-semibold text-muted">Subtotal</label>
                                <div class="fw-bold text-success fs-6 subtotal-display">$0.00</div>
                            </div>
                            <div class="col-md-1 text-end pt-4">
                                <button type="button" class="btn btn-outline-danger btn-sm remove-row-btn" title="Remove Item"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    </div>

                    <!-- Summary & Grand Total -->
                    <div class="d-flex justify-content-between align-items-center border-top pt-3 mt-4">
                        <div>
                            <span class="text-muted fw-semibold">Grand Total:</span>
                            <span id="grandTotalDisplay" class="fw-bold fs-4 text-success ms-2">$0.00</span>
                        </div>
                        <div class="d-flex gap-2">
                            <a th:href="@{/sales}" class="btn btn-light">Cancel</a>
                            <button type="submit" class="btn btn-success px-4 fw-semibold"><i class="bi bi-check-lg me-1"></i> Complete Sale & Print Invoice</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('itemsContainer');
    const addItemBtn = document.getElementById('addItemBtn');
    const grandTotalDisplay = document.getElementById('grandTotalDisplay');

    function updateCalculations() {
        let grandTotal = 0;
        const rows = container.querySelectorAll('.item-row');
        
        rows.forEach(row => {
            const select = row.querySelector('.medicine-select');
            const qtyInput = row.querySelector('.quantity-input');
            const subtotalDisplay = row.querySelector('.subtotal-display');

            const selectedOption = select.options[select.selectedIndex];
            const price = parseFloat(selectedOption ? selectedOption.getAttribute('data-price') : 0) || 0;
            const qty = parseInt(qtyInput.value) || 0;

            const subtotal = price * qty;
            subtotalDisplay.textContent = '$' + subtotal.toFixed(2);
            grandTotal += subtotal;
        });

        grandTotalDisplay.textContent = '$' + grandTotal.toFixed(2);
    }

    container.addEventListener('change', updateCalculations);
    container.addEventListener('input', updateCalculations);

    addItemBtn.addEventListener('click', function() {
        const firstRow = container.querySelector('.item-row');
        const newRow = firstRow.cloneNode(true);
        newRow.querySelector('.medicine-select').value = '';
        newRow.querySelector('.quantity-input').value = '1';
        newRow.querySelector('.subtotal-display').textContent = '$0.00';
        container.appendChild(newRow);
        updateCalculations();
    });

    container.addEventListener('click', function(e) {
        if (e.target.closest('.remove-row-btn')) {
            const rows = container.querySelectorAll('.item-row');
            if (rows.length > 1) {
                e.target.closest('.item-row').remove();
                updateCalculations();
            } else {
                alert('A sale must contain at least one item.');
            }
        }
    });
});
</script>

</body>
</html>
