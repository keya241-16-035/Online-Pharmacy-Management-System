<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('System Error')}"></head>
<body>

<div th:replace="~{layout :: navbar('dashboard')}"></div>

<div class="main-content">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center py-5">
            <div class="card card-custom p-5">
                <i class="bi bi-exclamation-octagon-fill text-danger display-1 mb-3"></i>
                <h2 class="fw-bold text-dark mb-2" th:text="${error != null ? error : 'Unexpected Error'}">Unexpected Error</h2>
                <p class="text-muted fs-5 mb-4" th:text="${message != null ? message : 'An error occurred while processing your request.'}">Error details...</p>
                <div>
                    <a th:href="@{/}" class="btn btn-primary px-4 py-2 fw-semibold me-2"><i class="bi bi-house-door me-1"></i> Go to Dashboard</a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2 fw-semibold"><i class="bi bi-arrow-left me-1"></i> Go Back</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
