<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Supplier Management')}"></head>
<body>

<div th:replace="~{layout :: navbar('supplier')}"></div>

<div class="main-content">
    
    <div th:replace="~{layout :: alerts}"></div>

    <div class="card card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="fw-bold mb-1">Suppliers Management</h4>
                <p class="text-muted small mb-0">Manage pharmaceutical suppliers and distributor contacts</p>
            </div>
            <a th:href="@{/supplier/new}" class="btn btn-primary fw-semibold">
                <i class="bi bi-plus-lg me-1"></i> Add New Supplier
            </a>
        </div>

        <!-- Search Bar -->
        <form th:action="@{/supplier}" method="get" class="mb-4">
            <div class="input-group" style="max-width: 400px;">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by name, contact, phone...">
                <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Search</button>
            </div>
        </form>

        <!-- Supplier Table -->
        <div class="table-responsive">
            <table class="table table-hover table-custom align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Supplier Name</th>
                        <th>Contact Person</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Address</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sup : ${suppliers}">
                        <td class="fw-bold text-muted" th:text="${sup.id}">1</td>
                        <td class="fw-semibold text-dark" th:text="${sup.name}">PharmaCare Ltd</td>
                        <td th:text="${sup.contactPerson}">Dr. Vance</td>
                        <td th:text="${sup.phone}">01711223344</td>
                        <td th:text="${sup.email}">contact@pharmacare.com</td>
                        <td th:text="${sup.address}">Boston</td>
                        <td class="text-end">
                            <a th:href="@{/supplier/edit/{id}(id=${sup.id})}" class="btn btn-outline-primary btn-sm me-1">
                                <i class="bi bi-pencil-square"></i> Edit
                            </a>
                            <a th:href="@{/supplier/delete/{id}(id=${sup.id})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure you want to delete this supplier?')">
                                <i class="bi bi-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(suppliers)}">
                        <td colspan="7" class="text-center text-muted py-4">No suppliers found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
